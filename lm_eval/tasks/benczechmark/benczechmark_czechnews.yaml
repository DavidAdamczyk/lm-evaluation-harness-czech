group: benczechmark_czechnews
group_alias: Benchmark Czech News
task:
  - task: benczechmark_czechnews_0
    task_alias: prompt-0
    class: !function utils.BCZMMultipleChoiceTask
    output_type: multiple_choice
    dataset_path: davidadamczyk/czechbench_czech_news
    test_split: test
    training_split: train
    fewshot_split: train
    num_fewshot: 3
    fewshot_delimiter: "\n"
    description: "Pro zadaný text pocházející ze zpravodajského článku urči jeho kategorii z následujícího výběru:\n2) Domácí\n3) Sport\n4) Kultura\n1) Zahraniční\n5) Ekonomika\nVždy vracej pouze název kategorie bez dalšího komentáře.\n"
    doc_to_text: "Urči kategorii pro následující příklad:\nText: {{brief}}\nKlasifikace: "
    doc_to_target: !function utils.get_czech_news_target
    doc_to_choice: ["Zahraniční", "Domácí", "Sport", "Kultura", "Ekonomika"]
    metric_list:
      - metric: acc
      - metric: macro_f1
        aggregation: !function utils.aggregate_macro_f1_score
        higher_is_better: true
      - metric: !function utils.avg_mcauroc
        aggregation: !function utils.aggregate_avg_mcauroc
        higher_is_better: true

