task: benczechmark_cs_snli
output_type: multiple_choice
dataset_path: CZLC/cs_snli
test_split: test
fewshot_split: test
num_fewshot: 3
fewshot_delimiter: "\n\n"
doc_to_text: "Premisa: {{cze_premise}}\nHypotéza: {{cze_hypothesis}}\nVyplývá hypotéza z premisy?\nOdpověď:"
doc_to_target: gold
doc_to_choice:
  - " ano"
  - " ne"
  - " nelze rozhodnout"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
