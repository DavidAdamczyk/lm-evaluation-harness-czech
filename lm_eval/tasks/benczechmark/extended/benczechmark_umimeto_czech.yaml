task: benczechmark_umimeto_czech
output_type: multiple_choice
dataset_path: CZLC/umimeto-qa
dataset_name: czech
process_docs: !function ../utils.process_umimeto
test_split: test
fewshot_split: test
num_fewshot: 3
fewshot_delimiter: "\n\n"
doc_to_text: "Otázka: {{question}}\nMožnosti:\nA. {{A}}\nB. {{B}}\nSprávná odpověď:"
doc_to_target: gold
doc_to_choice:
  - " A"
  - " B"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
