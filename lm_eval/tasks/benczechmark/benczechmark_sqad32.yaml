group: benczechmark_sqad32
group_alias: Simple QA Dataset 3.2
task:
  - task: benczechmark_sqad32_0
    task_alias: prompt-0
    class: !function utils.BCZMTask
    dataset_path: CZLC/sqad_3.2_filtered
    output_type: generate_until
    test_split: test
    training_split: test
    fewshot_split: test
    num_fewshot: 3
    fewshot_delimiter: "\n\n"
    target_delimiter: ""
    description: "Odpovězte na tyto otázky na základě textu. Ukončete odpověď symbolem '\n\n'.\n\n"
    doc_to_text: "Kontext: {{title}}-{{context}} Otázka: {{question}}\nOdpověď: "
    doc_to_target: "{{answers}}"
    generation_kwargs:
      until:
        - "\n\n"
        - "</s>"
        - "Otázka:"
        - "Dotaz:"
        - "<|im_end|>"
        - "Kontext:"
        - "<turn|>"
        - "<end_of_turn>"
      do_sample: false
      temperature: 0.0
      max_gen_toks: 20
    filter_list:
      - name: remove_whitespace
        filter:
          - function: remove_whitespace
          - function: take_first
    process_results: !function utils.process_results_qa_bcm
    metric_list:
      - metric: exact_match
        aggregation: mean
        higher_is_better: true
      - metric: f1
        aggregation: mean
        higher_is_better: true

