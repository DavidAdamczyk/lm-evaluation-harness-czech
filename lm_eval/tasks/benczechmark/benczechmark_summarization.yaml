group: benczechmark_summarization
group_alias: Czech Benchmark Summarization
task:
  - task: benczechmark_summarization_0
    task_alias: prompt-0
    class: !function utils.BCZMTask
    dataset_path: CZLC/sumeczech_downsampled
    output_type: generate_until
    training_split: train
    validation_split: validation
    test_split: test
    fewshot_split: train
    num_fewshot: 3
    description: "Následuje text a jeho souhrn (33 až 51 slov). Souhrn končí znakem '\n\n'.\n"
    doc_to_text: "{{text}}\nSouhrn: "
    doc_to_target: abstract
    target_delimiter: ""
    generation_kwargs:
      until:
        - "\n\n"
        - "</s>"
        - "<|im_end|>"
        - "<turn|>"
        - "<end_of_turn>"
      do_sample: false
      temperature: 0.0
      max_gen_toks: 128
    metric_list:
      - metric: !function utils.rouge_raw_r2_mid_f_without_bootstrap
        higher_is_better: true
        aggregation: mean

