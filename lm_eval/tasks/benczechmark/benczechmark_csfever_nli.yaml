task: benczechmark_csfever_nli
output_type: multiple_choice
dataset_path: CZLC/csfever_nli
test_split: test
fewshot_split: validation
num_fewshot: 3
fewshot_delimiter: "\n\n"
doc_to_text: "Důkaz: {{evidence}}\nTvrzení: {{claim}}\nJe tvrzení na základě důkazu pravdivé, nepravdivé, nebo nelze rozhodnout?\nOdpověď:"
doc_to_target: label
doc_to_choice:
  - " nepravdivé"
  - " nelze rozhodnout"
  - " pravdivé"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
