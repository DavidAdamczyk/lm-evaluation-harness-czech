group: benczechmark_sentiment_fb
group_alias: Sentiment
task:
  - task: benczechmark_sentiment_fb_0
    task_alias: prompt-0
    class: !function utils.BCZMMultipleChoiceTask
    output_type: multiple_choice
    dataset_path: CZLC/fb_sentiment_balanced
    test_split: test
    training_split: train
    fewshot_split: train
    num_fewshot: 3
    fewshot_delimiter: "\n"
    description: "Dále je můj seznam textů. Dělím je na negativní, neutrální a pozitivní.\n"
    doc_to_text: "{{query}} Toto shledávám jako: "
    doc_to_target: gold
    doc_to_choice: choices
    metric_list:
      - metric: acc
      - metric: macro_f1
        aggregation: !function utils.aggregate_macro_f1_score
        higher_is_better: true
      - metric: !function utils.avg_mcauroc
        aggregation: !function utils.aggregate_avg_mcauroc
        higher_is_better: true

